apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-identity
  labels:
    app: mysql-identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-identity
  template:
    metadata:
      labels:
        app: mysql-identity
    spec:
      containers:
        - name: mysql
          image: mysql:latest # Using a specific version is safer than 'latest'
          args:
            - "--max-connections=600"
            - "--innodb-buffer-pool-size=1G" # Dedicated cache for Identity DB
          env:
            - name: MYSQL_DATABASE
              value: identity
            - name: MYSQL_PASSWORD
              value: secret
            - name: MYSQL_ROOT_PASSWORD
              value: verysecret
            - name: MYSQL_USER
              value: myuser
          ports:
            - containerPort: 3306
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi" # This stops the OOMKilled errors
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: identity-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-identity
spec:
  ports:
    - port: 3306        
      targetPort: 3306
  selector:
    app: mysql-identity
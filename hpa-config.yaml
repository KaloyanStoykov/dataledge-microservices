apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: identity-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: identity-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60 # Scale up if CPU goes above 60%
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: datasource-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: datasource-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65 # Scale up if CPU goes above 60%
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway-service
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # Scale up instantly when load hits
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15        # Add 2 pods max every 15s to prevent "over-scaling"
    scaleDown:
      stabilizationWindowSeconds: 120 # Wait 2 minutes of low traffic before killing pods
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30        # Only kill 1 pod every 30s (gradual ramp down)
  metrics:
    - type: Pods
      pods:
        metric:
          name: http_server_requests_per_second
        target:
          type: AverageValue
          averageValue: "60"       # Slightly higher threshold to avoid "jitter"
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80   # Lowered from 90 to give breathing room
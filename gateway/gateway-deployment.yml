apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  # Netty & Reactor Tuning for 500+ VUs
  # These environment variables tune the underlying engine
  SPRING_CLOUD_GATEWAY_HTTPCLIENT_CONNECT-TIMEOUT: "5000" # 5s connect timeout
  SPRING_CLOUD_GATEWAY_HTTPCLIENT_RESPONSE-TIMEOUT: "15s" # 15s total response wait
  JWT_SECRET: "0008c5aa70752d59c85bf476aaf93607aae0e5ec8eb09caa06333d1459064f16ca60c5f20e335b8c4cc0acb81e70d5f3"
  JWT_EXPIRATION_MS: "3600000"

  application.yml: |
    server:
      port: 8080
      netty:
        connection-timeout: 5s
        worker-threads: 64 # Increased for high-volume routing
    spring:
      application:
        name: GATEWAY-SERVICE
      cloud:
        gateway:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:5173"
                allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
                allowedHeaders: "*"
                allowCredentials: true
          # Default filters applied to all routes for resilience
          default-filters:
            - name: Retry
              args:
                retries: 3
                series: SERVER_ERROR
                methods: GET,POST
                exceptions:
                  - java.net.ConnectException
                  - io.netty.channel.ConnectTimeoutException
                  - io.netty.handler.timeout.ReadTimeoutException
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
          routes:
            - id: actuator_route
              uri: no-op://localhost
              predicates:
                - Path=/actuator/**
              filters:
                - PreserveHostHeader

            - id: datasource-service-main
              uri: lb://DATASOURCE-SERVICE
              predicates:
                - Path=/datasources/**
              filters:
                - name: AuthenticationFilter

            - id: datasource-service-blob
              uri: lb://DATASOURCE-SERVICE
              predicates:
                - Path=/blob/**
              filters:
                - name: AuthenticationFilter

            - id: identity-service
              uri: lb://IDENTITY-SERVICE
              predicates:
                - Path=/auth/**
              filters:
                - name: AuthenticationFilter

            - id: datasource-service-types
              uri: lb://DATASOURCE-SERVICE
              predicates:
                - Path=/datasource-types/**
              filters:
                - name: AuthenticationFilter
    
    eureka:
      client:
        service-url:
          defaultZone: http://eureka-service:8761/eureka/
      instance:
        prefer-ip-address: true

    resilience4j:
      circuitbreaker:
        instances:
          authCircuitBreaker:
            slidingWindowSize: 10
            failureRateThreshold: 50
            waitDurationInOpenState: 5000ms

    management:
      endpoints:
        web:
          exposure:
            include: "health,info,prometheus"
      endpoint:
        health:
          show-details: always
      metrics:
        tags:
          application: ${spring.application.name}
        distribution:
          percentiles-histogram:
            http.server.requests: true
            http.client.requests: true
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway-app
          image: kiko12122/dataledge-gateway-service:1.5
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: SPRING_CONFIG_LOCATION
              value: "file:/config/application.yml"
          envFrom:
            - configMapRef:
                name: gateway-config
          volumeMounts:
            - name: config-volume
              mountPath: /config
      volumes:
        - name: config-volume
          configMap:
            name: gateway-config

---

apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  labels:
    app: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080